# 部署到 GitHub Pages。
# 只发布书本身（index / chapters / assets）：CLAUDE.md、README.md、spec/ 是仓库文档，
# chapters/_template.html 是写作模板，都不属于站点。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (book only)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R chapters assets _site/
          rm -f _site/chapters/_template.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
